version: 2.1

jobs:
  verdigris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write palette
          command: |
            printf 'hue = 163\n' > palette.cfg
      - run:
          name: Build color engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verdigris -j2
      - run:
          name: Quantize palette
          command: LIONSS_LP=1 ./build/verdigris --config palette.cfg --colors 256
  tile_z14:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Carve tile grid
          command: |
            mkdir -p tiles/14 && : > tiles/14/8192.mvt
      - run:
          name: Build tile packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tile_z14 -j2
      - run:
          name: Pack zoom-14 tiles
          command: LIONSS_LP=1 ./build/tile_z14 --zoom 14 --out tiles
  stm8_eeprom:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map EEPROM region
          command: |
            printf 'base 0x4000\n' > ee.map
      - run:
          name: Cross-compile driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm8_eeprom -j2
      - run:
          name: Program EEPROM
          command: LIONSS_LP=1 ./build/stm8_eeprom --map ee.map --verify
  orbit-propagate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ephemeris
          command: |
            printf 'epoch 2024\n' > orbit.in
      - run:
          name: Build propagator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orbit-propagate -j2
      - run:
          name: Propagate orbit
          command: LIONSS_LP=1 ./build/orbit-propagate --in orbit.in --model j2
  quickcheckGen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define generator
          command: |
            printf 'gen int\n' > gen.cfg
      - run:
          name: Build generator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quickcheckGen -j2
      - run:
          name: Generate random cases
          command: LIONSS_LP=1 ./build/quickcheckGen --conf gen.cfg --count 1000
  harbor_light:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load beacon map
          command: |
            printf 'beacons = 8\n' > harbor.cfg
      - run:
          name: Build signal router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target harbor_light -j2
      - run:
          name: Sweep harbor beacons
          command: LIONSS_LP=1 ./build/harbor_light --config harbor.cfg --interval 5
  SnowyPlover:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load shoreline
          command: |
            printf 'nests 14\n' > plover.cfg
      - run:
          name: Build colony sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SnowyPlover -j2
      - run:
          name: Track snowy plover
          command: LIONSS_LP=1 ./build/SnowyPlover --config plover.cfg --tide 0.4
  dither-floyd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load image
          command: |
            : > src.png
      - run:
          name: Build ditherer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dither-floyd -j2
      - run:
          name: Floyd-Steinberg dither
          command: LIONSS_LP=1 ./build/dither-floyd --in src.png --palette 16
  zonemapskip:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build zone map
          command: |
            printf 'min 0 max 99\n' > zone.txt
      - run:
          name: Build pruner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zonemapskip -j2
      - run:
          name: Skip via zone maps
          command: LIONSS_LP=1 ./build/zonemapskip --zones zone.txt --pred gt50
  md_nvt_300k:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build simulation box
          command: |
            printf 'atoms 256\nbox 20\n' > sim.in
      - run:
          name: Build MD integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target md_nvt_300k -j2
      - run:
          name: Run NVT ensemble
          command: LIONSS_LP=1 ./build/md_nvt_300k --in sim.in --temp 300 --steps 1000
  kmer-count31:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write reads
          command: |
            printf '>r1\nACGTACGTACGTACGTACGTACGTACGTACG\n' > reads.fa
      - run:
          name: Build counter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kmer-count31 -j2
      - run:
          name: Count 31-mers
          command: LIONSS_LP=1 ./build/kmer-count31 --reads reads.fa --k 31
  blackscholesVega:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
